# Configuration du Manhwa TikTok Automator.
# Les secrets (clés d'API) ne vont jamais ici : ils vont dans .env (voir .env.example).

# Dossier où arrivent les chapitres : inbox/<série>/<chapitre>/
# Chemin relatif au dossier du projet, ou absolu.
inbox = "inbox"

[slicer]
max_src_width = 1200      # largeur max du strip (les pages plus larges sont réduites)
bg_mode = "auto"          # fond des frames 9:16 : "auto" (couleur unie si la case est sur fond uni, sinon flou) | "blur" | "black" | "gray"
blur_ksize = 61
move_step = 20            # pas de déplacement (flèches, IJKL)
resize_step = 20          # pas de redimensionnement (+/-)
jpeg_quality = 92

[output]
width = 1080
height = 1920

[ocr]
engine = "paddle"         # "paddle" (le plus juste) | "windows" (30× plus rapide, se trompe sur le texte stylisé) | "tesseract"
device = "auto"           # PaddleOCR : "auto" = carte graphique si paddlepaddle-gpu est installé (26× plus rapide), "gpu" ou "cpu"
tesseract_cmd = ""        # vide = cherche tesseract dans le PATH puis à l'emplacement Windows par défaut
lang = "eng"
psm = 6

[tts]
voice = "en-US-ChristopherNeural"   # ex : "fr-FR-HenriNeural", "en-US-AriaNeural"
rate = "+0%"                         # vitesse (+10% conseillé pour TikTok)
volume = "+0%"
concurrency = 4
expressive = "all"   # "all" : toutes les voix jouent l'émotion (Chatterbox) ; "chosen" : seulement celles cochées
engine = "qwen"      # "qwen" : voix décrites par GPT et jouées par Qwen3-TTS (qwen_voice.py) ; sinon Chatterbox / voix de base

[render]
speed = 1.1               # rythme de la vidéo : voix 10 % plus rapide, blancs raccourcis d'autant
fps = 24
padding_seconds = 0.2      # silence ajouté après chaque réplique
silent_frame_seconds = 2.0 # durée d'une frame sans texte
zoom = 0.04               # léger zoom sur chaque frame (0 = image fixe)
pan = true                # une case plus haute que l'écran défile au lieu d'être réduite
music = ""                # un seul morceau pour tout (chemin) ; vide = la musique suit l'ambiance (ci-dessous)
music_moods = true        # calme / tension / combat / tristesse : music/<ambiance>/, sinon une nappe générée
music_volume = 0.16       # volume de la musique quand personne ne parle
music_duck = 0.4          # sous les voix, la musique descend à 40 % de ce volume
transition = "slide"      # passage d'une frame à l'autre : "slide" (défilement), "fade" ou "none"
transition_seconds = 0.3
effects = true            # l'image tremble sur un coup, flash sur un coup violent (d'après les sons)
depth = true              # relief : pendant le zoom, le premier plan avance un peu plus que le fond
ambience = true           # une ambiance de fond par lieu (prison, forêt, marché…), sous les voix
ambience_volume = 0.13    # le fond reste discret, surtout sans voix par-dessus
voice_space = true        # les voix prennent de la chaleur et résonnent comme le lieu
loudness = -14            # niveau final du son (LUFS, comme TikTok) ; 0 = laisser tel quel
natural_rhythm = true     # blancs selon le dialogue (qui répond, colère, tristesse) au lieu d'un blanc fixe
guide = true              # case longue : la caméra va voir la bulle de celui qui parle
talk = true               # visages qui parlent : la bouche bat à chaque syllabe, les yeux clignent (onglet Personnages)
layout = "scroll"         # "scroll" : la planche défile de case en case (scroll.py) ; "cases" : une case par image
scroll_fit = true         # en défilement, la case lue remplit la largeur de l'écran (zoom en glissant)
captions = true           # sous-titres karaoké (le mot dit passe en jaune)
captions_words = 4        # mots affichés ensemble
captions_font = ""        # chemin d'une police .ttf ; vide = Impact (ou une autre police grasse de Windows)
captions_size = 78

[auto]
# Ce que la machine décide seule quand tu n'as rien choisi (tu peux toujours changer après).
sounds = true             # chaque case prend le son proposé d'après l'image (onglet Sons)
review = true             # « Tout faire » : les corrections de GPT (texte, type, qui parle) sont acceptées d'office
speakers = 0.0            # « qui parle » validé d'office à partir de cette confiance (0 = jamais ; 0.2 ≈ 79 % justes)

[sounds]
# Qui regarde ce qui se passe dans chaque case, pour choisir les bruitages (onglet Sons → Comprendre les cases) :
# "local" = Qwen3.5-2B sur ta carte graphique (≈ 5 s par case, sans clé) ; "gpt" = GPT regarde l'image.
vision = "local"

[scraper]
headless = false           # false : la fenêtre s'affiche (nécessaire pour passer Cloudflare à la main)
workers = 5
timeout_seconds = 20

# Profils de sites : le premier profil dont un domaine apparaît dans l'URL est utilisé,
# sinon "default". Si un site change sa mise en page, on modifie ses sélecteurs ici.
[scraper.sites.default]
domains = []
title = "span.text-xl.font-bold"
chapter_links = "a[href*='chapter']"
image_min_width = 300
image_extensions = [".webp"]   # liste vide = accepte toutes les images
